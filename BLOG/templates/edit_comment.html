<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="30" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Comment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="other-page"> 
    <button onclick="history.back()" class="back" >Back</button>
    {% with messages = get_flashed_messages(with_categories=True) %}
        {% for category, message in messages %}
            <p class="flash-message {{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    {% if error %}
        <p class="error"><strong>Error:</strong> {{ error }}</p>
    {% endif %}
    <div>
       <form action="{{ url_for('edit_comment',comment_id=comment.id) }}" method="post" class="forms" enctype="multipart/form-data">
       <label for="comment_text">Edit Comment:</label>
       <textarea name="comment_text" id="comment_text" rows="4" cols="50">{{ comment.text }}</textarea>
       <br>
       <input style="background-color: blue;" type="submit" value="Update Comment">
      </form>
    </div>
</body>
</html>
