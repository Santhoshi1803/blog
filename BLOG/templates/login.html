<!DOCTYPE html>
<html lang="en">
  <head>
     <meta charset="UTF-8" />
     <meta http-equiv="refresh" content="3600" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Login Page</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="other-page">
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% if error %}
      <p  class="flash-message {{ category }}" style="color: red;"><strong>Error:</strong> {{ error }}</p>
    {% endif %}
    <button onclick="history.back()" class="back" >Back</button>
    <h1 class="header-h1">BLOG</h1>
    <form action="{{ url_for('login') }}" method="POST" class="forms">
      <fieldset>
        <h2><legend>LOGIN</legend></h2>

        <label for="username">Username</label><br>
        <input type="text" name="username" placeholder="username" required><br>

        <label for="password">Password</label><br>
        <input type="password" name="password" placeholder="password" required><br>

        <label for="role">Select your role</label><br> 
        <select name="role" required>
          <option value="">--select--</option>
          <option value="user" {% if request.form.get('role') == 'user' %}selected{% endif %}>User</option>
          <option value="admin" {% if request.form.get('role') == 'admin' %}selected{% endif %}>Admin</option>
        </select><br>

        <button type="submit" class="in-button">Login</button>     
      </fieldset>
    </form>
  </body>
</html>
